[package]
name = "fury-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
fury-core = { path = "../../fury-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core"
harness = false