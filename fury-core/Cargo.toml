[package]
name = "fury-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "js"] }
parking_lot = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"

[features]
default = ["db"]
db = ["dep:sqlx"]
