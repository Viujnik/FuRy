[package]
name = "fury-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Keep the concrete driver and its matching SQLx core without unused drivers.
sqlx-core = { version = "=0.9.0", optional = true, features = ["_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "=0.9.0", optional = true, features = ["chrono", "uuid"] }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "js"] }
parking_lot = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"

[features]
default = ["db"]
db = ["dep:sqlx-core", "dep:sqlx-postgres"]

[dev-dependencies]
tokio.workspace = true
