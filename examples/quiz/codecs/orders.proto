syntax = "proto3";

package shop;

message Order {
  int64 order_id = 1;
  int64 placed_at_ms = 2;
  string buyer_name = 3;
  string city = 4;
  string status = 5;
  string currency = 6;
  int64 total_cents = 7;
  sint64 adjustment_cents = 8;
  int64 item_count = 9;
  optional string coupon = 10;
  optional string note = 11;
}

message OrderFeed {
  repeated Order rows = 1;
}
