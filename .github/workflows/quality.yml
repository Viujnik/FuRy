name: FuRy quality

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 2'

permissions:
  contents: read

concurrency:
  group: fury-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  RUSTUP_TOOLCHAIN: 1.94.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: bash scripts/check-rust.sh
      - run: cargo bench --locked -p fury-bench --bench core -- --test

  interoperability:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      FURY_TEST_DATABASE_URL: postgres://fury:fury@127.0.0.1:5432/fury_test
      FURY_WASM_PROFILE: release
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fury
          POSTGRES_PASSWORD: fury
          POSTGRES_DB: fury_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Install build tools
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          python -m pip install --disable-pip-version-check maturin==1.14.1
          cargo install --locked --version 0.15.0 wasm-pack
      - run: cargo test --locked -p fury-core --test postgres_contract -- --ignored
      - run: bash scripts/check-bindings.sh --postgres
      - name: Smoke-test the PostgreSQL-to-web example
        run: bash scripts/check-web-demo.sh
      - run: bash scripts/check-benchmarks.sh
      - name: Keep benchmark measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fury-node-benchmarks
          path: target/benchmark-results/
          if-no-files-found: ignore
          retention-days: 21

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: RustSec
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install --locked --version 0.22.2 cargo-audit
          cargo audit --deny unsound --deny yanked
      - name: npm advisories
        if: ${{ !cancelled() }}
        run: |
          npm audit --prefix fury-cli/tests/typescript --package-lock-only --ignore-scripts --audit-level=moderate
          npm audit --prefix benches/node --package-lock-only --ignore-scripts --audit-level=moderate
      - name: Python benchmark dependency advisories
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit --no-deps --disable-pip --requirement benches/python/requirements.txt

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Compare Rust public API to the PR base
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            echo "No PR base. The wire and consumer tests run independently."
            exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          if ! git cat-file -e "$BASE_SHA:fury-core/src/encoder/buffer.rs" 2>/dev/null; then
            echo "::notice::The base predates the codec; the consumer tests establish its initial API."
            exit 0
          fi
          archive="$RUNNER_TEMP/semver-checks.tar.gz"
          curl -fsSL https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.51.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz --output "$archive"
          echo "cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/semver"
          tar -xzf "$archive" -C "$RUNNER_TEMP/semver"
          checker=$(find "$RUNNER_TEMP/semver" -type f -name cargo-semver-checks)
          "$checker" semver-checks check-release --package fury-core --baseline-rev "$BASE_SHA"

  extended:
    name: Extended (${{ matrix.os }}, Rust ${{ matrix.rust }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, rust: '1.94.1'}
          - {os: macos-15, rust: '1.94.1'}
          - {os: ubuntu-24.04, rust: stable}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      FURY_FUZZ_CASES: 20000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: bash scripts/check-rust.sh
      - name: Verify PostgreSQL TLS and server identity
        if: ${{ runner.os == 'Linux' && matrix.rust == '1.94.1' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          export PATH="$(pg_config --bindir):$PATH"
          bash scripts/test-postgres-tls-local.sh
      - run: cargo bench --locked -p fury-bench --bench core
        if: ${{ runner.os == 'Linux' && matrix.rust == '1.94.1' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && runner.os == 'Linux' && matrix.rust == '1.94.1' }}
        with:
          name: fury-criterion-ubuntu
          path: target/criterion/
          if-no-files-found: ignore
          retention-days: 21

  required:
    name: FuRy required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [rust, interoperability, dependencies, compatibility]
    if: ${{ always() }}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success'
